# Matomeru Configuration
# Copy this file to matomeru.toml in your working directory
# and fill in your actual values.

[profile]
# Interest profile, as an array-of-tables. Each section needs a non-empty
# 'name' and 'text'; names must be unique. The profile is embedded in the
# LLM digest prompts and drives the reranker's per-section scoring.

[[profile.sections]]
name = "About me"
text = """
Software engineer interested in programming languages, tooling, and
open-source development. Lives in Germany, learning Japanese.
"""

[[profile.sections]]
name = "Local AI"
text = """
Local LLM inference, quantization, and small models that run on consumer
hardware.
"""

[[profile.sections]]
name = "arXiv relevance guidance"
text = """
Keep papers on: LLM agent research, tabular machine learning, and applied
statistics. Prefer papers with released code and demonstrated applicability.
"""

[reddit]
# Subreddits to monitor (required, at least one)
subreddits = ["python", "rust", "machinelearning"]

# Number of top posts per subreddit (default: 3)
posts_per_subreddit = 3

# Number of top comments per post (default: 20)
comments_per_post = 20

[arxiv]
# arXiv categories to monitor. At least one category or search term is
# required; leaving both empty is a ConfigError.
categories = ["cs.AI", "cs.LG"]

# Optional abstract search terms (quoted phrases). These act as the
# fallback selector for every category that has no category_terms entry
# (see below); when category_terms covers a category, its list replaces
# these terms for that category's feed.
search_terms = ["large language model", "transformer"]

# Optional per-category search terms overriding the global search_terms.
# Keys are category names written exactly as in `categories` (matching is
# case-insensitive and tolerates surrounding whitespace and a "cat:"
# prefix, but write keys plainly, e.g. "cs.AI"). A category with an entry
# uses that list as its feed's selector; an explicitly empty list ([]) means
# "keep all papers in this category". A category without an entry falls back
# to the global search_terms. A key with no matching configured category is
# inert (harmless, but does nothing).
# [arxiv.category_terms]
# cs.AI = ["large language model", "agent"]
# cs.LG = []

# Maximum results requested from the arXiv API per run (default: 100)
max_results = 100

[notes]
# Notes MCP folder paths (create these in your Notes vault, or let
# Matomeru create them; empty disables notes delivery for that source)
reddit_folder = "Matomeru/Reddit"
arxiv_folder = "Matomeru/arXiv"
