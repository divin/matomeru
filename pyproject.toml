[project]
name = "matomeru"
version = "0.1.0"
description = "Daily Reddit and arXiv digests with personalized summaries"
readme = "README.md"
authors = [
    { name = "divin", email = "71128266+divin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2",
    "httpx>=0.28",
    "pydantic>=2",
    "pydantic-ai>=1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
matomeru-reddit = "matomeru.cli:main_reddit"
matomeru-arxiv = "matomeru.cli:main_arxiv"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "ty>=0.0.99",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
